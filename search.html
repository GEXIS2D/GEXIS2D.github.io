---
layout: guide
title: Search
description: Find documentation sections by title or keyword.
permalink: /search/
---
<label class="search-label" for="doc-search">Search sections</label>
<input id="doc-search" class="search-input" type="search" placeholder="Search installation, tutorials, theory…" autocomplete="off">
<p id="search-status" role="status">Enter a section title or keyword, such as installation, tutorials or theory.</p>
<ul id="search-results" class="search-results"></ul>
<noscript><p>Enable JavaScript to search, or browse the documentation navigation.</p></noscript>
<script type="application/json" id="search-index">[{% for item in site.data.software_nav %}{"title":{{ item.title | jsonify }},"label":{{ item.label | jsonify }},"description":{{ item.description | jsonify }},"url":{{ item.url | relative_url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
