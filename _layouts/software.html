<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}GEXIS2D</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ '/assets/software/mark.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/software/site.css' | relative_url }}">
  <script src="{{ '/assets/software/search.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳转到正文</a>
  <header class="topbar">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/software/mark.svg' | relative_url }}" width="32" height="32" alt=""><span>GEXIS<span class="brand-accent">2D</span></span></a>
      <details class="mobile-menu"><summary>导航菜单</summary><nav aria-label="移动端导航">{% for item in site.data.software_nav %}<a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% endfor %}<a href="{{ '/search/' | relative_url }}">搜索文档</a></nav></details>
      <nav class="desktop-nav" aria-label="主导航">{% for item in site.data.software_nav %}<a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>{% endfor %}</nav>
      <a class="search-link" href="{{ '/search/' | relative_url }}" aria-label="搜索文档">⌕ <span>搜索</span></a>
      <a class="github-link" href="https://github.com/GEXIS2D/GEXIS2D.github.io">GitHub ↗</a>
    </div>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="footer"><div class="container footer-inner"><div><a class="footer-brand" href="{{ '/' | relative_url }}">GEXIS2D</a><p>项目展示 · 学习资源 · 技术文档</p></div><nav aria-label="页脚导航"><a href="{{ '/research/' | relative_url }}">原研究页面</a><a href="{{ '/publications/' | relative_url }}">论文资料</a><a href="{{ '/people/' | relative_url }}">团队资料</a><a href="{{ '/contribute/' | relative_url }}">参与贡献</a></nav><p class="footer-note">文档持续建设中<br>Hosted on GitHub Pages</p></div></footer>
</body>
</html>
